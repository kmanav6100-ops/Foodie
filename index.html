
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff5635">
<title>Foodie - Food Delivery</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#222;padding-bottom:85px}
header{background:white;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:30px;color:#ff5635}
button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#ff5635;color:white;font-size:15px}
.lang{font-weight:bold}
.profile{font-size:13px;color:#555;margin-top:10px}
.search{width:100%;padding:16px;border:1px solid #ddd;border-radius:15px;font-size:16px;margin-top:20px}
section{padding:15px}
h2{font-size:22px;font-weight:500}
.categories{display:flex;overflow-x:auto;gap:12px}
.cat{min-width:100px;background:white;padding:15px;text-align:center;border-radius:15px;border:2px solid transparent}
.cat span{display:block;font-size:35px}
.cat.active{border-color:#ff5635}
.banner{background:#ff5635;color:white;padding:25px;border-radius:18px;margin:15px}
.banner h2{margin-top:0}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.food{background:white;border-radius:14px;overflow:hidden;padding-bottom:12px}
.food-img{height:110px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:65px}
.food h3,.food p,.food .price{margin:8px 10px}
.food p{font-size:13px;color:#777}
.price{color:#ff5635;font-weight:bold}
.food button{margin:5px 10px;width:calc(100% - 20px)}
.cartbar{position:fixed;bottom:0;left:0;width:100%;background:white;padding:12px;display:flex;justify-content:center;box-shadow:0 -2px 10px #ddd}
.cartbox{display:none;background:white;margin:15px;padding:15px;border-radius:15px}
.cart-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.auth{display:none;position:fixed;inset:0;background:#0009;z-index:10;align-items:center;justify-content:center;padding:15px}
.authbox{background:white;padding:22px;border-radius:18px;width:100%;max-width:400px}
.authbox input{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
.authbox button{width:100%;margin-top:10px}
.authbox .secondary{background:#555}
#message{font-size:13px;color:#e43b27}
@media(min-width:650px){.foods{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo">🍔 Foodie</div>
<div>
<button class="lang" id="langBtn">हिंदी</button>
<button id="loginBtn">Login</button>
</div>
</div>

<div class="profile" id="profile">📍 Bhagalpur, Bihar</div>
<input class="search" id="search" placeholder="Search food or restaurants...">
</header>

<section>
<h2 id="craving">What are you craving?</h2>
<div class="categories" id="categories"></div>
</section>

<div class="banner">
<h2 id="bannerTitle">Hungry? Let's eat!</h2>
<p id="bannerText">Delicious food delivered to your door ❤️</p>
</div>

<section>
<h2 id="popular">Popular Food</h2>
<div class="foods" id="foods"></div>
</section>

<div class="cartbox" id="cartBox">
<h2 id="cartTitle">Your Cart</h2>
<div id="cartItems"></div>
<h3 id="total">Total: ₹0</h3>
<button id="checkout">Continue</button>
</div>

<div class="cartbar">
<button id="cartBtn">🛒 Cart (0) - ₹0</button>
</div>

<!-- LOGIN / REGISTER MODAL -->
<div class="auth" id="authModal">
<div class="authbox">
<div class="top">
<h2 id="authTitle">Customer Login</h2>
<button id="closeAuth">✕</button>
</div>

<input id="customerName" placeholder="Your Name" style="display:none">
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">

<p id="message"></p>

<button id="submitAuth">Login</button>
<button class="secondary" id="switchAuth">Create New Account</button>
<button class="secondary" id="forgot">Forgot Password?</button>
</div>
</div>

<!-- FOODIE CHECKOUT MODAL -->
<div id="checkoutModal" style="
display:none;
position:fixed;
inset:0;
z-index:9999;
background:#0009;
align-items:center;
justify-content:center;
padding:15px;
">
  <div style="
  background:white;
  width:100%;
  max-width:450px;
  padding:22px;
  border-radius:18px;
  max-height:90vh;
  overflow:auto;
  ">
    <h2>Delivery Details / डिलीवरी विवरण</h2>

    <input id="deliveryName"
    placeholder="Customer Name / नाम"
    required style="width:100%;padding:13px;margin:8px 0;">

    <input id="deliveryPhone"
    type="tel" placeholder="Mobile Number / मोबाइल नंबर"
    required maxlength="10"
    style="width:100%;padding:13px;margin:8px 0;">

    <textarea id="deliveryAddress"
    placeholder="Full Delivery Address / पूरा पता"
    required style="width:100%;padding:13px;margin:8px 0;min-height:90px;"></textarea>

    <input id="deliveryPincode"
    type="text" inputmode="numeric"
    placeholder="PIN Code / पिन कोड"
    required maxlength="6"
    style="width:100%;padding:13px;margin:8px 0;">

    <h3 id="checkoutTotal">Total: ₹0</h3>

    <p>Payment Method / भुगतान का तरीका</p>
    <select id="paymentMethod" style="width:100%;padding:13px;">
      <option value="COD">Cash on Delivery (COD)</option>
    </select>

    <button id="placeOrder" style="
    width:100%;padding:15px;margin-top:15px;
    background:#ff5635;color:white;border:0;
    border-radius:10px;font-size:16px;">
      Place Order / ऑर्डर करें
    </button>

    <button id="closeCheckout" style="
    width:100%;padding:12px;margin-top:10px;
    background:#555;color:white;border:0;
    border-radius:10px;">
      Close / बंद करें
    </button>
  </div>
</div>
  
<script type="module">

// FIREBASE IMPORT
import { initializeApp }
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail,
signOut,
updateProfile,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

// YOUR FIREBASE CONFIGURATION

import {
  getFirestore,
  collection,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
  
  const firebaseConfig = {
apiKey: "AIzaSyDiXSnRuzu2E_2I2foUn009z4bcSFU6FZc",
authDomain: "foodie-7eaf0.firebaseapp.com",
projectId: "foodie-7eaf0",
storageBucket: "foodie-7eaf0.firebasestorage.app",
messagingSenderId: "567494207534",
appId: "1:567494207534:web:44d13c67dcebfb8dfa57bf"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
// LANGUAGE
let language = "en"; nhi
let selectedCategory = "All";
let cart = [];
let isRegister = false;

const translations = {
en:{
login:"Login",logout:"Logout",
craving:"What are you craving?",
popular:"Popular Food",
search:"Search food or restaurants...",
banner:"Hungry? Let's eat!",
bannerText:"Delicious food delivered to your door ❤️",
cart:"Cart",all:"All",add:"Add to Cart",
name:"Your Name",email:"Email Address",
password:"Password",register:"Create Account",
loginTitle:"Customer Login",registerTitle:"Customer Registration",
forgot:"Forgot Password?",continue:"Continue",
categories:["All","Pizza","Burger","Biryani","Chicken","Noodles"]
},
hi:{
login:"लॉगिन",logout:"लॉगआउट",
craving:"आप क्या खाना चाहेंगे?",
popular:"लोकप्रिय खाना",
search:"खाना या रेस्टोरेंट खोजें...",
banner:"भूख लगी है? चलिए खाते हैं!",
bannerText:"स्वादिष्ट खाना आपके दरवाजे तक ❤️",
cart:"कार्ट",all:"सभी",add:"कार्ट में डालें",
name:"आपका नाम",email:"ईमेल पता",
password:"पासवर्ड",register:"खाता बनाएँ",
loginTitle:"ग्राहक लॉगिन",registerTitle:"नया खाता बनाएँ",
forgot:"पासवर्ड भूल गए?",continue:"आगे बढ़ें",
categories:["सभी","पिज्जा","बर्गर","बिरयानी","चिकन","नूडल्स"]
}
};

const products=[
{id:1,name:"Chicken Biryani",hi:"चिकन बिरयानी",cat:"Biryani",emoji:"🍛",price:149},
{id:2,name:"Veg Pizza",hi:"वेज पिज्जा",cat:"Pizza",emoji:"🍕",price:199},
{id:3,name:"Cheese Burger",hi:"चीज बर्गर",cat:"Burger",emoji:"🍔",price:99},
{id:4,name:"Chicken Curry",hi:"चिकन करी",cat:"Chicken",emoji:"🍗",price:129},
{id:5,name:"Veg Noodles",hi:"वेज नूडल्स",cat:"Noodles",emoji:"🍜",price:89},
{id:6,name:"Paneer Biryani",hi:"पनीर बिरयानी",cat:"Biryani",emoji:"🍚",price:119}
];

const $=id=>document.getElementById(id);

// CHANGE LANGUAGE
function updateLanguage(){
const t=translations[language];
$("langBtn").textContent=language==="en"?"हिंदी":"English";
$("loginBtn").textContent=auth.currentUser?t.logout:t.login;
$("craving").textContent=t.craving;
$("popular").textContent=t.popular;
$("search").placeholder=t.search;
$("bannerTitle").textContent=t.banner;
$("bannerText").textContent=t.bannerText;
$("cartTitle").textContent=t.cart;
$("cartBtn").textContent=`🛒 ${t.cart} (${cart.length}) - ₹${cart.reduce((s,x)=>s+x.price*x.qty,0)}`;
renderCategories();
renderFoods();
}

$("langBtn").onclick=()=>{
language=language==="en"?"hi":"en";
updateLanguage();
};

// CATEGORIES
function renderCategories(){
const t=translations[language];
const emojis=["🍽️","🍕","🍔","🍛","🍗","🍜"];
$("categories").innerHTML=t.categories.map((c,i)=>`
<div class="cat ${i===0&&selectedCategory==="All"||products.some(p=>p.cat===selectedCategory)&&p.cat===["All","Pizza","Burger","Biryani","Chicken","Noodles"][i]?"active":""}"
data-cat="${["All","Pizza","Burger","Biryani","Chicken","Noodles"][i]}">
<span>${emojis[i]}</span>${c}
</div>`).join("");

document.querySelectorAll(".cat").forEach(el=>{
el.onclick=()=>{
selectedCategory=el.dataset.cat;
renderCategories();
renderFoods();
};
});
}

// FOOD LIST
function renderFoods(){
const query=$("search").value.toLowerCase();
const list=products.filter(p=>
(selectedCategory==="All"||p.cat===selectedCategory)&&
(p.name.toLowerCase().includes(query)||p.hi.includes(query))
);

$("foods").innerHTML=list.map(p=>`
<div class="food">
<div class="food-img">${p.emoji}</div>
<h3>${language==="en"?p.name:p.hi}</h3>
<p>${language==="en"?"Delicious food":"स्वादिष्ट खाना"}</p>
<div class="price">₹${p.price}</div>
<button data-id="${p.id}">${translations[language].add}</button>
</div>`).join("");

document.querySelectorAll(".food button").forEach(btn=>{
btn.onclick=()=>addToCart(Number(btn.dataset.id));
});
}

$("search").oninput=renderFoods;

// CART
function addToCart(id){
const p=products.find(x=>x.id===id);
const item=cart.find(x=>x.id===id);
if(item)item.qty++;
else cart.push({...p,qty:1});
updateCart();
}

function updateCart(){
const count=cart.reduce((s,x)=>s+x.qty,0);
const amount=cart.reduce((s,x)=>s+x.price*x.qty,0);

$("cartBtn").textContent=`🛒 ${translations[language].cart} (${count}) - ₹${amount}`;
$("total").textContent=`Total: ₹${amount}`;

$("cartItems").innerHTML=cart.map(p=>`
<div class="cart-item">
<span>${language==="en"?p.name:p.hi} × ${p.qty}</span>
<span>₹${p.price*p.qty}
<button data-id="${p.id}" class="remove">−</button>
</span>
</div>`).join("");

document.querySelectorAll(".remove").forEach(btn=>{
btn.onclick=()=>{
const item=cart.find(x=>x.id===Number(btn.dataset.id));
if(item){
item.qty--;
if(item.qty===0)cart=cart.filter(x=>x.id!==item.id);
}
updateCart();
};
});
}

$("cartBtn").onclick=()=>{
$("cartBox").style.display=
$("cartBox").style.display==="block"?"none":"block";
};


// OPEN CHECKOUT
$("checkout").onclick=()=>{
  if(!auth.currentUser){
    $("authModal").style.display="flex";
    return;
  }

  if(cart.length===0){
    alert("Please add food to cart!");
    return;
  }

  $("checkoutTotal").textContent =
    "Total: ₹" + cart.reduce(
      (sum,item)=>sum+item.price*item.qty,0
    );

  $("checkoutModal").style.display="flex";
};

// CLOSE CHECKOUT
$("closeCheckout").onclick=()=>{
  $("checkoutModal").style.display="none";
};

// PLACE ORDER
$("placeOrder").onclick=async()=>{
  const user=auth.currentUser;

  if(!user){
    alert("Please login first!");
    return;
  }

  const name=$("deliveryName").value.trim();
  const phone=$("deliveryPhone").value.trim();
  const address=$("deliveryAddress").value.trim();
  const pincode=$("deliveryPincode").value.trim();

  if(!name || !phone || !address || !pincode){
    alert("Please fill all delivery details!");
    return;
  }

  if(!/^[6-9]\d{9}$/.test(phone)){
    alert("Enter valid mobile number!");
    return;
  }

  if(!/^\d{6}$/.test(pincode)){
    alert("Enter valid PIN code!");
    return;
  }

  if(cart.length===0){
    alert("Your cart is empty!");
    return;
  }

  const total=cart.reduce(
    (sum,item)=>sum+item.price*item.qty,0
  );

  const items=cart.map(item=>({
    productId:item.id,
    name:item.name,
    price:Number(item.price),
    quantity:Number(item.qty)
  }));

  $("placeOrder").disabled=true;
  $("placeOrder").textContent="Please wait...";

  try{
    const result=await addDoc(
      collection(db,"orders"),{
        customerId:user.uid,
        customerName:name,
        phone:phone,
        deliveryAddress:{
          address:address,
          pincode:pincode
        },
        items:items,
        total:total,
        paymentMethod:"COD",
        status:"pending",
        createdAt:serverTimestamp()
      }
    );

    alert(
      "Order placed successfully!\nOrder ID: "+
      result.id
    );

    cart=[];
    updateCart();
    $("checkoutModal").style.display="none";

  }catch(error){
    alert("Order failed: "+error.message);
  }finally{
    $("placeOrder").disabled=false;
    $("placeOrder").textContent="Place Order / ऑर्डर करें";
  }
};


// AUTH MODAL
$("loginBtn").onclick=()=>{
if(auth.currentUser){
signOut(auth);
return;
}
$("authModal").style.display="flex";
};

$("closeAuth").onclick=()=>{
$("authModal").style.display="none";
};

function authLabels(){
const t=translations[language];
$("authTitle").textContent=isRegister?t.registerTitle:t.loginTitle;
$("customerName").style.display=isRegister?"block":"none";
$("customerName").placeholder=t.name;
$("email").placeholder=t.email;
$("password").placeholder=t.password;
$("submitAuth").textContent=isRegister?t.register:t.login;
$("switchAuth").textContent=isRegister?t.loginTitle:t.register;
$("forgot").textContent=t.forgot;
}

$("switchAuth").onclick=()=>{
isRegister=!isRegister;
$("message").textContent="";
authLabels();
};

$("submitAuth").onclick=async()=>{
const email=$("email").value.trim();
const password=$("password").value;
const name=$("customerName").value.trim();

$("message").textContent="Please wait...";

try{
if(!email||!password)throw new Error("Email and password required");
if(password.length<6)throw new Error("Password must be at least 6 characters");

if(isRegister){
if(!name)throw new Error("Please enter your name");

const result=await createUserWithEmailAndPassword(auth,email,password);
await updateProfile(result.user,{displayName:name});
$("message").textContent="Account created successfully!";
}else{
await signInWithEmailAndPassword(auth,email,password);
$("message").textContent="Login successful!";
}

setTimeout(()=>{$("authModal").style.display="none";},800);

}catch(error){
$("message").textContent=error.message;
}
};

// FORGOT PASSWORD
$("forgot").onclick=async()=>{
const email=$("email").value.trim();
if(!email){
$("message").textContent="Enter your email first";
return;
}
try{
await sendPasswordResetEmail(auth,email);
$("message").textContent="Password reset email sent!";
}catch(error){
$("message").textContent=error.message;
}
};

// AUTH STATE
onAuthStateChanged(auth,user=>{
if(user){
$("profile").textContent="👤 "+(user.displayName||user.email);
$("loginBtn").textContent=translations[language].logout;
}else{
$("profile").textContent="📍 Bhagalpur, Bihar";
$("loginBtn").textContent=translations[language].login;
}
});

updateLanguage();
updateCart();
authLabels();

</script>
</body>
</html>
