
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foodie - Food Delivery</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#222;padding-bottom:90px}
header{background:white;padding:20px}
.logo{font-size:30px;color:#ff5635;font-weight:bold}
header p{color:#777}
.search{width:100%;padding:15px;border:1px solid #ddd;border-radius:15px;font-size:16px;margin-top:12px}
h2{margin:24px 16px 14px}
.categories{display:flex;overflow-x:auto;gap:12px;padding:8px 15px}
.cat{min-width:90px;text-align:center;background:white;padding:15px 8px;border-radius:15px;cursor:pointer}
.cat span{font-size:35px;display:block}
.banner{margin:18px 15px;padding:25px;background:#ff5635;color:white;border-radius:18px}
.banner h2{margin:0 0 10px}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.food{background:white;border-radius:14px;overflow:hidden;padding-bottom:12px}
.food-img{height:110px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:65px}
.food h3{font-size:16px;margin:10px}
.food p{margin:8px 10px;color:#777;font-size:13px}
.price{font-weight:bold;color:#ff5635;margin:10px}
.food button{margin:0 10px;width:calc(100% - 20px);padding:10px;border:0;border-radius:8px;background:#ff5635;color:white;font-weight:bold}
.cartbar{position:fixed;bottom:0;left:0;width:100%;background:white;padding:12px;box-shadow:0 -2px 10px #ddd;display:flex;justify-content:center}
.cartbar button{background:#ff5635;color:white;border:0;padding:14px 30px;border-radius:12px;font-size:16px}
#cartBox{display:none;background:white;margin:15px;padding:15px;border-radius:15px}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
.qty button{padding:5px 10px;margin:2px}
</style>
</head>
<body>

<header>
<div class="logo">🍔 Foodie</div>
<p>📍 भागलपुर, बिहार</p>
<input class="search" id="search" placeholder="खाना या रेस्टोरेंट खोजें..." oninput="renderFoods()">
</header>

<h2>आप क्या खाना चाहेंगे?</h2>
<div class="categories">
<div class="cat" onclick="category('All')"><span>🍽️</span>सभी</div>
<div class="cat" onclick="category('Pizza')"><span>🍕</span>पिज्जा</div>
<div class="cat" onclick="category('Burger')"><span>🍔</span>बर्गर</div>
<div class="cat" onclick="category('Biryani')"><span>🍛</span>बिरयानी</div>
<div class="cat" onclick="category('Chicken')"><span>🍗</span>चिकन</div>
<div class="cat" onclick="category('Noodles')"><span>🍜</span>नूडल्स</div>
</div>

<div class="banner">
<h2>भूख लगी है? चलिए खाते हैं!</h2>
<p>स्वादिष्ट खाना आपके दरवाजे तक ❤️</p>
</div>

<h2>लोकप्रिय खाना 🍴</h2>
<div class="foods" id="foods"></div>

<div id="cartBox">
<h2>🛒 आपका Cart</h2>
<div id="cartItems"></div>
<h3 id="total">कुल: ₹0</h3>
<button onclick="checkout()" style="background:#ff5635;color:white;padding:13px;border:0;border-radius:10px;width:100%">ऑर्डर करें</button>
</div>

<div class="cartbar">
<button onclick="showCart()">🛒 Cart (<span id="count">0</span>) - ₹<span id="amount">0</span></button>
</div>

<script>
const products=[
{id:1,name:"चिकन बिरयानी",cat:"Biryani",emoji:"🍛",price:149,desc:"स्वादिष्ट इंडियन बिरयानी"},
{id:2,name:"वेज पिज्जा",cat:"Pizza",emoji:"🍕",price:199,desc:"ताजा और चीज़ी पिज्जा"},
{id:3,name:"चीज बर्गर",cat:"Burger",emoji:"🍔",price:99,desc:"स्वादिष्ट चीज बर्गर"},
{id:4,name:"चिकन लेग पीस",cat:"Chicken",emoji:"🍗",price:129,desc:"मसालेदार चिकन"},
{id:5,name:"वेज नूडल्स",cat:"Noodles",emoji:"🍜",price:89,desc:"स्वादिष्ट चाइनीज नूडल्स"},
{id:6,name:"वेज बिरयानी",cat:"Biryani",emoji:"🍚",price:119,desc:"ताजी वेज बिरयानी"},
{id:7,name:"पनीर पिज्जा",cat:"Pizza",emoji:"🍕",price:229,desc:"पनीर और चीज पिज्जा"},
{id:8,name:"चिकन बर्गर",cat:"Burger",emoji:"🍔",price:139,desc:"क्रिस्पी चिकन बर्गर"}
];

let selected="All";
let cart=JSON.parse(localStorage.getItem("foodieCart")||"{}");

function category(cat){
selected=cat;
renderFoods();
}

function renderFoods(){
let q=document.getElementById("search").value.toLowerCase();
let list=products.filter(p=>
(selected==="All"||p.cat===selected)&&
p.name.toLowerCase().includes(q)
);
document.getElementById("foods").innerHTML=list.length?list.map(p=>`
<div class="food">
<div class="food-img">${p.emoji}</div>
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">₹${p.price}</div>
<button onclick="add(${p.id})">Add to Cart +</button>
</div>`).join(""):"<p>कोई खाना नहीं मिला।</p>";
}

function save(){
localStorage.setItem("foodieCart",JSON.stringify(cart));
updateCart();
}

function add(id){
cart[id]=(cart[id]||0)+1;
save();
}

function change(id,n){
cart[id]=(cart[id]||0)+n;
if(cart[id]<=0)delete cart[id];
save();
showCart();
}

function updateCart(){
let count=0,total=0;
Object.keys(cart).forEach(id=>{
let p=products.find(x=>x.id==id);
count+=cart[id];
total+=p.price*cart[id];
});
document.getElementById("count").innerText=count;
document.getElementById("amount").innerText=total;
document.getElementById("total").innerText="कुल: ₹"+total;
}

function showCart(){
let box=document.getElementById("cartBox");
box.style.display=box.style.display==="block"?"none":"block";
box.scrollIntoView({behavior:"smooth"});
let html="";
Object.keys(cart).forEach(id=>{
let p=products.find(x=>x.id==id);
html+=`<div class="cart-item">
<div>${p.emoji} ${p.name}<br>₹${p.price}</div>
<div class="qty">
<button onclick="change(${id},-1)">−</button>
${cart[id]}
<button onclick="change(${id},1)">+</button>
</div>
</div>`;
});
document.getElementById("cartItems").innerHTML=html||"आपका Cart खाली है।";
}

function checkout(){
if(!Object.keys(cart).length){
alert("पहले Cart में खाना जोड़ें!");
return;
}
alert("Foodie का Demo Checkout तैयार है। वास्तविक ऑर्डर के लिए अगला चरण पूरा करना होगा।");
}

renderFoods();
updateCart();
</script>
</body>
</html>
